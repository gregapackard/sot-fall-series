<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050508"><meta property="og:title" content="Important Torn Market Update"><meta property="og:description" content="You need to see this."><title>Torn Market Update</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050508;color:white;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;touch-action:manipulation}#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at center,#20203c 0%,#080810 55%,#000 100%)}#cat{display:block;max-width:min(95vw,750px);max-height:80vh;object-fit:contain;filter:drop-shadow(0 0 45px #d27cff55);animation:bop .5s ease-in-out infinite alternate}#glow{position:fixed;inset:-40%;pointer-events:none;background:conic-gradient(from 0deg,transparent,#ff00c31b,transparent,#00d8ff20,transparent);animation:spin 7s linear infinite}#tap{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;padding:0 18px max(52px,env(safe-area-inset-bottom));background:linear-gradient(transparent 70%,#0009);cursor:pointer}#tap span{border:1px solid #ffffff6b;padding:14px 22px;border-radius:999px;background:#ffffff21;backdrop-filter:blur(8px);font-weight:750;box-shadow:0 6px 35px #0008}#tap.show{display:flex}#mute{position:fixed;right:14px;top:14px;border:1px solid #ffffff33;border-radius:999px;background:#0007;color:white;padding:12px;cursor:pointer;font-size:18px}#credit{position:fixed;bottom:12px;opacity:.24;font-size:10px;letter-spacing:.17em;pointer-events:none} @keyframes spin{to{transform:rotate(360deg)}}@keyframes bop{to{transform:scale(1.04)}}
</style></head><body>
<div id="stage"><div id="glow"></div><img id="cat" src="https://cdn.jsdelivr.net/gh/orlyjamie/spinningcat@main/cat.gif" alt="Spinning cat" draggable="false"></div>
<audio id="audio" src="https://cdn.jsdelivr.net/gh/ahmetuman/oiia-cat@main/oiia-oiia-spinning-cat-made-with-Voicemod.mp3" autoplay loop preload="auto" playsinline></audio>
<button id="mute" aria-label="Mute or unmute">🔊</button><div id="tap" role="button" tabindex="0"><span>🔊 TAP TO UNLEASH THE OIIA</span></div><div id="credit">OIIA OIIA OIIA</div>
<script>
const audio=document.getElementById('audio'),tap=document.getElementById('tap'),mute=document.getElementById('mute');
audio.volume=1;
function sync(){mute.textContent=audio.muted?'🔇':'🔊';}
async function start(){try{audio.muted=false;await audio.play();tap.classList.remove('show');sync();}catch(e){tap.classList.add('show');}}
function gesture(){start();}
tap.addEventListener('click',gesture);tap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();gesture();}});
mute.addEventListener('click',async()=>{if(audio.paused){await start();return;}audio.muted=!audio.muted;sync();});
audio.addEventListener('error',()=>{tap.classList.add('show');tap.querySelector('span').textContent='🔊 TAP TO PLAY';});
window.addEventListener('pageshow',start);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audio.paused)start();});start();
</script></body></html>
