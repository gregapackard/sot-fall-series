<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050508;color:white;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;touch-action:manipulation}#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at center,#20203c 0%,#080810 55%,#000 100%)}#cat{display:block;max-width:min(95vw,750px);max-height:80vh;object-fit:contain;filter:drop-shadow(0 0 45px #d27cff55);animation:bop .5s ease-in-out infinite alternate;visibility:hidden}#glow{position:fixed;inset:-40%;pointer-events:none;background:conic-gradient(from 0deg,transparent,#ff00c31b,transparent,#00d8ff20,transparent);animation:spin 7s linear infinite}#tap{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;padding:20px;background:#050508;cursor:pointer;text-align:center}#tap span{border:1px solid #ffffff6b;padding:14px 22px;border-radius:999px;background:#ffffff21;backdrop-filter:blur(8px);font-weight:750;box-shadow:0 6px 35px #0008}#tap.show{display:flex}#tap:not(.show){display:none}#tap strong{color:#ff991a;font-size:clamp(22px,6vw,45px);text-shadow:0 0 20px #fa6700}#tap span{font-size:clamp(22px,5vw,32px);color:#fff;background:#de6c0f;padding:20px 42px}#mute{position:fixed;right:14px;top:14px;border:1px solid #ffffff33;border-radius:999px;background:#0007;color:white;padding:12px;cursor:pointer;font-size:18px}#credit{position:fixed;bottom:12px;opacity:.24;font-size:10px;letter-spacing:.17em;pointer-events:none} @keyframes spin{to{transform:rotate(360deg)}}@keyframes bop{to{transform:scale(1.04)}}

<audio id="audio" src="https://cdn.jsdelivr.net/gh/ahmetuman/oiia-cat@main/oiia-oiia-spinning-cat-made-with-Voicemod.mp3" loop preload="none" playsinline></audio>
<button id="mute" aria-label="Mute or unmute">🔊</button><div id="tap" class="show" role="button" tabindex="0"><strong>🎃 CLAIM YOUR FREE XAN 🎃</strong><span>CLICK HERE</span></div><div id="credit">OIIA OIIA OIIA</div>
<script>
const audio=document.getElementById('audio'),tap=document.getElementById('tap'),mute=document.getElementById('mute'),cat=document.getElementById('cat');
let activated=false;
audio.volume=1;
function sync(){mute.textContent=audio.muted?'🔇':'🔊';}
async function start(){
  if(!activated){
    activated=true;
    // Assign the GIF URL only on the user's click so its animation starts with the audio.
    cat.src=cat.dataset.src;
    cat.style.visibility='visible';
    tap.classList.remove('show');
  }
  try{audio.muted=false;await audio.play();sync();}
  catch(e){tap.classList.add('show');tap.querySelector('span').textContent='CLICK HERE';}
}
tap.addEventListener('click',start);
tap.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start();}});
mute.addEventListener('click',async()=>{if(audio.paused){await start();return;}audio.muted=!audio.muted;sync();});
audio.addEventListener('error',()=>{tap.classList.add('show');tap.querySelector('span').textContent='CLICK HERE';});
</script></body></html>
