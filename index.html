<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoT Fall Series — Race Control</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0e13;color:#f3f3f5}header{padding:45px 16px;background:linear-gradient(155deg,#6d1725,#11141b 75%);text-align:center}h1{font-size:clamp(2rem,7vw,4rem);margin:4px}header p,.sub{color:#aeb5c3}main{max-width:1100px;margin:auto;padding:16px}.metrics,.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.card,.panel{border:1px solid #303540;background:#171b24;border-radius:13px;padding:15px}.card b{display:block;font-size:1.5rem;color:#ff858c}.card span{color:#adb5c2}nav{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0}button,select,input{border:1px solid #454b57;background:#242a35;color:white;padding:10px;border-radius:8px}button{cursor:pointer}button.active{background:#9a3441}section{display:none}section.active{display:block}.panel{overflow-x:auto;margin:12px 0}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #333a45;text-align:left}th{cursor:pointer;color:#b8c0cd}td a{color:#ff969c;cursor:pointer;text-decoration:underline}tr:hover{background:#252b35}#search{max-width:100%;width:320px}footer{text-align:center;color:#8992a2;padding:30px}@media(max-width:600px){th,td{padding:8px;font-size:13px}}
</style></head><body><header><div>🏁 SOT FALL SERIES</div><h1>RACE CONTROL</h1><p>Every race. Every driver. Every questionable decision.</p></header><main><div class="metrics" id="metrics"></div><nav><button class="active" data-tab="overview">Latest race</button><button data-tab="drivers">Driver standings</button><button data-tab="archive">Race archive</button></nav><section class="active" id="overview"><h2>Latest podium</h2><div class="podium" id="podium"></div><h2>Full results</h2><div class="panel" id="latest"></div></section><section id="drivers"><h2>Driver form</h2><p class="sub">Average finish is not official championship points. Missed means absent from the race results.</p><input id="search" placeholder="Search driver…"><div class="panel" id="driverTable"></div><div id="profile" class="panel" hidden></div></section><section id="archive"><h2>Race archive</h2><select id="raceSelect"></select><div id="raceDetails" class="panel"></div></section><p id="error"></p></main><footer>SoT Fall Series • Results sourced from Torn racing exports</footer><script>
let D=null,sort='avg',ascending=true;const $=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clock=n=>n==null?'—':Math.floor(n/60)+':'+(n%60).toFixed(2).padStart(5,'0');function link(x){return '<a data-id="'+esc(x.id)+'">'+esc(x.name)+'</a>'}function results(r){let a=[...r.results].sort((x,y)=>(x.pos??999)-(y.pos??999)),best=Math.min(...a.map(x=>x.lap??Infinity)),lead=a[0]?.time;return '<table><thead><tr><th>Pos</th><th>Driver</th><th>Race time</th><th>Best lap</th><th>Gap</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+(x.dnf?'DNF':esc(x.pos))+'</td><td>'+link(x)+'</td><td>'+clock(x.time)+'</td><td>'+clock(x.lap)+(x.lap===best?' 🔥':'')+'</td><td>'+(x.time!=null&&lead!=null?'+'+(x.time-lead).toFixed(2)+'s':'—')+'</td></tr>').join('')+'</tbody></table>'}function render(){let r=D.races.at(-1);$('metrics').innerHTML=[['Races',D.races.length],['Drivers',D.drivers.length],['Latest entrants',r.results.length],['Latest round',r.title]].map(x=>'<div class="card"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+'</span></div>').join('');$('podium').innerHTML=[...r.results].sort((a,b)=>a.pos-b.pos).slice(0,3).map((x,i)=>'<div class="card"><span>'+['🥇 Winner','🥈 Second','🥉 Third'][i]+'</span><b>'+link(x)+'</b><span>'+clock(x.time)+'</span></div>').join('');$('latest').innerHTML=results(r);$('raceSelect').innerHTML=D.races.map((r,i)=>'<option value="'+i+'">'+esc(r.title)+'</option>').join('');$('raceSelect').value=D.races.length-1;archive();drivers()}function archive(){$('raceDetails').innerHTML=results(D.races[+$('raceSelect').value])}function drivers(){let a=D.drivers.filter(x=>x.name.toLowerCase().includes($('search').value.toLowerCase()));a.sort((x,y)=>{let v=x[sort]??Infinity,w=y[sort]??Infinity;return (typeof v==='string'?v.localeCompare(w):v-w)*(ascending?1:-1)});$('driverTable').innerHTML='<table><thead><tr>'+[['name','Driver'],['entered','Entered'],['missed','Missed'],['wins','Wins'],['podiums','Podiums'],['fastest','Fastest laps'],['avg','Avg finish']].map(([k,v])=>'<th data-sort="'+k+'">'+v+(sort===k?(ascending?' ↑':' ↓'):'')+'</th>').join('')+'</tr></thead><tbody>'+a.map(x=>'<tr><td>'+link(x)+'</td><td>'+x.entered+'</td><td>'+x.missed+'</td><td>'+x.wins+'</td><td>'+x.podiums+'</td><td>'+x.fastest+'</td><td>'+(x.avg??'—')+'</td></tr>').join('')+'</tbody></table>'}function profile(id){let d=D.drivers.find(x=>x.id===id);if(!d)return;document.querySelector('[data-tab="drivers"]').click();$('profile').hidden=false;$('profile').innerHTML='<h2>'+esc(d.name)+'</h2><p>Entered '+d.entered+' / '+D.races.length+' races • '+d.wins+' wins • '+d.podiums+' podiums</p><table><tr><th>Round</th><th>Result</th><th>Best lap</th></tr>'+D.races.map(r=>{let x=r.results.find(x=>x.id===id);return '<tr><td>'+esc(r.title)+'</td><td>'+(x?(x.dnf?'DNF':'P'+x.pos):'DNS')+'</td><td>'+(x?clock(x.lap):'—')+'</td></tr>'}).join('')+'</table>';$('profile').scrollIntoView({behavior:'smooth'})}document.addEventListener('click',e=>{let l=e.target.closest('[data-id]');if(l)profile(l.dataset.id);let h=e.target.closest('[data-sort]');if(h){ascending=sort===h.dataset.sort?!ascending:true;sort=h.dataset.sort;drivers()}});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab))});$('search').oninput=drivers;$('raceSelect').onchange=archive;fetch('./data.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('data.json missing');return r.json()}).then(x=>{D=x;render()}).catch(e=>$('error').textContent=e.message);
</script></body></html>
